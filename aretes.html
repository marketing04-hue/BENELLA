<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benella - Anillos</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #faf9f6;
            color: #333;
        }
        .header-section {
            background-color: #331e11; /* Color café oscuro */
            color: white;
            display: flex;
            align-items: center;
            padding: 0;
        }
        .header-image {
            width: 40%; /* Ajuste para la imagen lateral */
            max-width: 400px;
            object-fit: cover;
        }
        .header-text {
            padding: 40px;
            font-size: 16px;
            line-height: 1.6;
        }
        .category-title {
            margin: 40px 10%;
            font-weight: normal;
            letter-spacing: 1px;
            font-size: 24px;
        }
        .product-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 0 10%;
            margin-bottom: 40px;
        }
        .product-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 150px;
        }
        .product-image-box {
            width: 100%;
            height: 150px;
            background-color: #fcfcf4;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: -15px; /* Para que el precio monte un poco sobre la caja */
            z-index: 1;
        }
        /* Para simular la imagen del producto, puedes cambiar el img src dentro del box más adelante */
        .product-image-box img {
            max-width: 80%;
            max-height: 80%;
        }
        .price-tag {
            background-color: #331e11;
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: bold;
            z-index: 2;
        }
        .buy-button {
            display: block;
            width: 200px;
            margin: 40px auto;
            padding: 15px;
            background-color: #331e11;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Menú de navegación simple para volver al inicio -->
    <div style="padding: 20px 10%; background: white;">
        <a href="index.html" style="text-decoration: none; color: black; font-weight: bold; font-size: 20px;">BENELLA</a>
    </div>

    <!-- Cabecera de la categoría -->
    <div class="header-section">
        <!-- Reemplaza con la imagen correspondiente a la categoría (ej. image_eb7224.jpg para anillos) -->
        <img src="image_eb7224.jpg" alt="Anillos" class="header-image">
        <div class="header-text">
            Piezas diseñadas para perdurar. Nuestra joyería combina metales preciosos y gemas seleccionadas para resaltar tu brillo natural en cada ocasión especial.
        </div>
    </div>

    <h2 class="category-title">ANILLOS</h2>

    <!-- Cuadrícula de productos -->
    <div class="product-grid">
        <!-- Producto 1 -->
        <div class="product-card">
            <div class="product-image-box">
                <!-- Aquí iría la imagen recortada del producto si la tienes -->
                <span style="color: #ccc;">Foto</span>
            </div>
            <div class="price-tag">$350</div>
        </div>
        <!-- Producto 2 -->
        <div class="product-card">
            <div class="product-image-box"><span style="color: #ccc;">Foto</span></div>
            <div class="price-tag">$350</div>
        </div>
        <!-- Producto 3 -->
        <div class="product-card">
            <div class="product-image-box"><span style="color: #ccc;">Foto</span></div>
            <div class="price-tag">$350</div>
        </div>
         <!-- Producto 4 -->
         <div class="product-card">
            <div class="product-image-box"><span style="color: #ccc;">Foto</span></div>
            <div class="price-tag">$350</div>
        </div>
    </div>

    <a href="#" class="buy-button">COMPRA AQUÍ</a>

</body>
</html>
